# Nola 生产环境配置
# 使用方式：java -jar build/libs/nola-all.jar -config=config/application-prod.conf
# 敏感值通过环境变量注入；未设置时保留空值，生产校验会拒绝启动。
ktor {
    development = false

    deployment {
        host = "0.0.0.0"
        host = ${?NOLA_HOST}
        port = 8098
        port = ${?NOLA_PORT}
        # 停止服务时等待在途请求完成，最多等待 30 秒
        shutdownGracePeriod = 30000
        shutdownTimeout = 30000
    }

    application {
        modules = [cc.loac.ApplicationKt.module]
    }

    cors {
        # 生产环境禁止 anyHost，必须显式配置前端域名
        anyHost = false
        # 也可用环境变量 NOLA_CORS_ALLOWED_HOSTS（逗号分隔）覆盖
        allowedHosts = ["https://blog.example.com"]
    }

    storage {
        # MySQL；如使用 MariaDB，将驱动改为 org.mariadb.jdbc.Driver
        driverClassName = "com.mysql.cj.jdbc.Driver"
        driverClassName = ${?NOLA_DB_DRIVER}
        jdbcURL = "jdbc:mysql://localhost:3306/nola?serverTimezone=Asia/Shanghai&useUnicode=true"
        jdbcURL = ${?NOLA_DB_URL}
        databaseName = "nola"
        databaseName = ${?NOLA_DB_NAME}
        username = "root"
        username = ${?NOLA_DB_USER}
        password = ""
        password = ${?NOLA_DB_PASSWORD}
    }

    redis {
        redisURL = "redis://localhost:6379"
        redisURL = ${?NOLA_REDIS_URL}
    }
}

jwt {
    issuer = "https://api.example.com"
    issuer = ${?NOLA_JWT_ISSUER}
    domain = "https://api.example.com"
    domain = ${?NOLA_JWT_DOMAIN}
    audience = "users"
    audience = ${?NOLA_JWT_AUDIENCE}
    realm = "Nola"
    # 必须至少 32 位随机字符串
    secret = ""
    secret = ${?NOLA_JWT_SECRET}
}

accessLog {
    # 数据库内最多保留的访问日志条数
    maxLength = 2000
}
